name: QuickCue
options:
  bundleIdPrefix: ru.quickcue
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: QuickCue
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 0.3.1
    QUICKCUE_SOURCE_REVISION: unknown
configs:
  Debug: debug
  Release: release
targets:
  QuickCue:
    type: application
    platform: iOS
    sources:
      - path: QuickCue
        excludes:
          - Resources/Info.plist
          - Resources/QuickCue.entitlements
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: QuickCue/Resources/Info.plist
      properties:
        CFBundleDisplayName: QuickCue
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        QuickCueSourceRevision: "$(QUICKCUE_SOURCE_REVISION)"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "QuickCue использует микрофон только во время явно запущенной сессии, чтобы распознавать русскую речь."
        NSSpeechRecognitionUsageDescription: "QuickCue преобразует окружающую речь в текст и ищет вопросы."
        NSCameraUsageDescription: "QuickCue фотографирует задачи, чтобы распознать текст и подготовить ответ."
        NSBluetoothAlwaysUsageDescription: "Bluetooth нужен для будущей поддержки совместимой BLE-кнопки съёмки."
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes: []
    entitlements:
      path: QuickCue/Resources/QuickCue.entitlements
      properties: {}
    scheme:
      testTargets:
        - QuickCueTests
  QuickCueTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuickCueTests
    dependencies:
      - target: QuickCue
      - target: QuickCueLegacyFixture
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: QuickCueTests
        PRODUCT_MODULE_NAME: QuickCueTests
        PRODUCT_BUNDLE_IDENTIFIER: ru.quickcue.app.tests
  # Test-only original unversioned model module. Never embed it in the app.
  QuickCueLegacyFixture:
    type: framework.static
    platform: iOS
    sources:
      - path: QuickCueMigrationFixtures
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: QuickCueLegacyFixture
        PRODUCT_MODULE_NAME: QuickCueLegacyFixture
        PRODUCT_BUNDLE_IDENTIFIER: ru.quickcue.app.legacy-fixture
        SKIP_INSTALL: YES
