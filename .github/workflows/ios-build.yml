name: Build QuickCue iOS

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate privacy manifest and repository safety
        run: python3 .github/scripts/validate_repository.py

      - name: Test real Darwin URLSession transport and record Foundation framing
        run: |
          set -o pipefail
          mkdir -p TestResults
          swift test 2>&1 | tee TestResults/transport-tests.log

      - name: Upload transport evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: QuickCue-transport-evidence
          path: TestResults/transport-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project QuickCue.xcodeproj -list

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project QuickCue.xcodeproj \
            -scheme QuickCue \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            QUICKCUE_SOURCE_REVISION="$GITHUB_SHA" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Run unit tests
        run: |
          set -o pipefail

          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          ')"

          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi

          xcodebuild \
            -project QuickCue.xcodeproj \
            -scheme QuickCue \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath TestResults/QuickCue.xcresult \
            QUICKCUE_SOURCE_REVISION="$GITHUB_SHA" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: QuickCue-test-results
          path: TestResults/QuickCue.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Build for physical iPhone
        run: |
          set -o pipefail
          rm -rf build-device

          xcodebuild \
            -project QuickCue.xcodeproj \
            -scheme QuickCue \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build-device" \
            QUICKCUE_SOURCE_REVISION="$GITHUB_SHA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify packaged build identity
        run: |
          python3 - <<'PY'
          import json, os, pathlib, plistlib
          products = pathlib.Path("build-device/Build/Products/Release-iphoneos")
          apps = list(products.glob("*.app"))
          assert len(apps) == 1, "Expected exactly one app"
          info = plistlib.loads((apps[0] / "Info.plist").read_bytes())
          identity = {name: info.get(name) for name in ["CFBundleShortVersionString", "CFBundleVersion", "QuickCueSourceRevision"]}
          pathlib.Path("TestResults/build-identity.json").write_text(json.dumps(identity, indent=2), encoding="utf-8")
          print(json.dumps(identity), flush=True)
          assert identity["CFBundleShortVersionString"] == "0.3.1", f"Unexpected version: {identity['CFBundleShortVersionString']!r}"
          assert identity["CFBundleVersion"] == "5", f"Unexpected build: {identity['CFBundleVersion']!r}"
          assert identity["QuickCueSourceRevision"] == os.environ["GITHUB_SHA"], "Source revision missing or mismatched"
          PY

      - name: Upload build identity
        uses: actions/upload-artifact@v6
        with:
          name: QuickCue-build-identity
          path: TestResults/build-identity.json
          if-no-files-found: error
          retention-days: 7

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find build-device/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "QuickCue.app was not found"
            exit 1
          fi

          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          rm -rf ipa/Payload/*.app/_CodeSignature

          cd ipa
          zip -qry ../QuickCue-unsigned.ipa Payload
          cd ..

          ls -lh QuickCue-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: QuickCue-unsigned-ipa
          path: QuickCue-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
